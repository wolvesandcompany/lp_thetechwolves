services:
  landing-page:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techwolves-landing
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing.rule=Host(`thetechwolves.com`) || Host(`www.thetechwolves.com`)"
      - "traefik.http.routers.landing.entrypoints=websecure"
      - "traefik.http.routers.landing.tls.certresolver=le"
      - "traefik.http.services.landing.loadbalancer.server.port=3000"
      # Redirect www → root domain
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.thetechwolves\\.com(.*)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://thetechwolves.com$${1}"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.landing.middlewares=www-redirect"

networks:
  default:
    name: clinic_ai_default
    external: true
